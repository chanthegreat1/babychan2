<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>图片测试</title>
</head>
<body>
  <h1>直连测试</h1>
  < img src="https://img.babychan.cc.cd/photo/2025/2025_05_27_22_18_47_IMG_0946.webp" style="max-width: 300px;">
  
  <h1>JS 动态渲染测试</h1>
  <div id="box"></div>

  <script>
    const testUrl = "https://img.babychan.cc.cd/photo/2025/2025_05_27_22_18_47_IMG_0946.webp";
    
    // 测试 1: 直接 innerHTML 插入
    document.getElementById('box').innerHTML = `< img src="${testUrl}" style="max-width: 300px;">`;

    // 测试 2: 用 fetch 抓取图片二进制
    fetch(testUrl)
      .then(res => {
        console.log("Fetch 状态码:", res.status);
        if(!res.ok) throw new Error("Fetch 失败，状态码: " + res.status);
        return res.blob();
      })
      .then(blob => console.log("Fetch 成功，获取到图片 Blob:", blob))
      .catch(err => console.error("Fetch 报错细节:", err));
  </script>
</body>
</html>
