<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>知沛·陈的欢楽时光</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
  <style>
    :root {
      --google-blue: #1a73e8;
      --google-bg: #ffffff;
      --sidebar-bg: #ffffff;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --border-color: #e0e0e0;
      --card-radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--google-bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 顶栏 Header */
    header {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
      flex-shrink: 0;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 4px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .logo-icon { width: 28px; height: 28px; flex-shrink: 0; }
    .logo-text { font-size: 1.15rem; font-weight: 500; color: #3c4043; }

    .search-container {
      flex: 1;
      max-width: 560px;
      position: relative;
    }

    .search-box {
      width: 100%;
      padding: 9px 16px 9px 40px;
      background: #f1f3f4;
      border: 1px solid transparent;
      border-radius: 24px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box:focus {
      background: #fff;
      border-color: var(--border-color);
      box-shadow: 0 1px 6px rgba(32,33,36,0.2);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      fill: var(--text-secondary);
      width: 18px;
      height: 18px;
    }

    /* 主布局 */
    .app-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 64px);
      overflow: hidden;
      position: relative;
    }

    /* 遮罩层 (移动端 Sidebar 打开时) */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 64px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 64px);
      background: rgba(0,0,0,0.4);
      z-index: 80;
    }
    .sidebar-overlay.active { display: block; }

    /* 侧边栏 Sidebar */
    aside {
      width: 240px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
      user-select: none;
      transition: transform 0.25s ease-in-out;
      z-index: 90;
    }

    .sidebar-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 8px 0 4px 12px;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-btn:hover { background: #f1f3f4; }
    .sidebar-btn.active {
      background: #e8f0fe;
      color: var(--google-blue);
      font-weight: 500;
    }

    .sidebar-btn.sub-item {
      padding-left: 32px;
      font-size: 0.85rem;
    }

    /* 主展示区 Main */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      position: relative;
    }

    .month-group { margin-bottom: 36px; }
    .month-header {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 16px;
      position: sticky;
      top: -24px;
      background: var(--google-bg);
      padding: 10px 0;
      z-index: 10;
    }

    /* 瀑布流网格 */
    .photo-grid {
      column-count: 4;
      column-gap: 24px;
    }

    .photo-card {
      break-inside: avoid;
      margin-bottom: 24px;
      position: relative;
      background: #ffffff;
      border-radius: var(--card-radius);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #f0f0f0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .photo-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    .media-wrapper {
      position: relative;
      width: 100%;
      background: #f1f3f4;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 统一用 img 展示静态缩略图（哪怕是视频也是显示 Python 提取的 WebP 首帧） */
    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* 视频标识角标 */
    .video-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      pointer-events: none;
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    /* 缩略图下方信息栏（年龄/时间描述） */
    .card-meta-bar {
      padding: 10px 12px;
      background: #ffffff;
    }

    .card-title-text {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .card-sub-text {
      font-size: 0.78rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loading-sentinel {
      text-align: center;
      padding: 30px;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Lightbox 全屏 Modal */
    .lightbox-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }
    .lightbox-modal.active { display: flex; }
    .lightbox-body { 
      flex: 1; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      width: 100%; 
      overflow: hidden;
    }
    .lightbox-media { 
      max-width: 95vw; 
      max-height: 80vh; 
      border-radius: 4px; 
      object-fit: contain; 
    }
    .lightbox-footer { 
      color: #fff; 
      text-align: center; 
      max-width: 800px;
      width: 100%;
      padding: 8px;
    }
    .lightbox-close { 
      position: absolute; 
      top: 16px; 
      right: 24px; 
      color: #fff; 
      font-size: 36px; 
      cursor: pointer; 
      z-index: 1010;
      line-height: 1;
    }

    /* 移动端响应式 Breakpoints */
    @media (max-width: 1200px) { 
      .photo-grid { column-count: 3; column-gap: 20px; }
      main { padding: 20px; }
    }
    @media (max-width: 850px) { 
      .photo-grid { column-count: 2; column-gap: 16px; }
      .photo-card { margin-bottom: 16px; }
    }
    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      .logo-text { display: none; }
      aside {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
        box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      }
      aside.open { transform: translateX(0); }
      .photo-grid { column-count: 2; column-gap: 10px; }
      .photo-card { margin-bottom: 10px; }
      main { padding: 12px; }
    }
  </style>
</head>
<body>

  <!-- 顶栏 -->
  <header>
    <div class="header-left">
      <button class="menu-toggle" id="menuBtn" onclick="toggleSidebar()">☰</button>
      <div class="logo-group" onclick="selectFilter('all')">
        <svg class="logo-icon" viewBox="0 0 24 24">
          <path fill="#ea4335" d="M12 0C15.31 0 18 2.69 18 6v6h-6C8.69 12 6 9.31 6 6s2.69-6 6-6z"/>
          <path fill="#4285f4" d="M24 12c0 3.31-2.69 6-6 6h-6v-6c0-3.31 2.69-6 6-6s6 2.69 6 6z"/>
          <path fill="#fbbc05" d="M12 24c-3.31 0-6-2.69-6-6v-6h6c3.31 0 6 2.69 6 6s-2.69 6-6 6z"/>
          <path fill="#34a853" d="M0 12c0-3.31 2.69-6 6-6h6v6c0 3.31 2.69-6 6-6s-6-2.69-6-6z"/>
        </svg>
        <span class="logo-text">知沛·陈的欢楽时光</span>
      </div>
    </div>

    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" id="searchInput" class="search-box" placeholder="搜索照片、地点、年龄...">
    </div>
  </header>

  <!-- 主界面布局 -->
  <div class="app-layout">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    
    <aside id="sidebar">
      <div class="sidebar-menu">
        <button class="sidebar-btn active" id="btn-all" onclick="selectFilter('all')">
          🖼️ 照片
        </button>
      </div>

      <div>
        <div class="sidebar-section-title">集锦 / 探索</div>
        <div class="sidebar-menu">
          <button class="sidebar-btn" id="btn-albums" onclick="selectFilter('albums')">📁 相册</button>
          <button class="sidebar-btn" id="btn-people" onclick="selectFilter('people')">👶 人物</button>
          <button class="sidebar-btn" id="btn-location" onclick="selectFilter('location')">📍 地点</button>
          <button class="sidebar-btn" id="btn-videos" onclick="selectFilter('videos')">🎥 视频</button>
          <button class="sidebar-btn" id="btn-documents" onclick="selectFilter('documents')">📄 文档</button>
          <button class="sidebar-btn" id="btn-screenshots" onclick="selectFilter('screenshots')">📱 截图和录屏</button>
        </div>
      </div>

      <div>
        <div class="sidebar-section-title">时间分类</div>
        <div class="sidebar-menu" id="month-sub-menu"></div>
      </div>
    </aside>

    <main id="mainScrollArea">
      <div id="gallery"></div>
      <div class="loading-sentinel" id="loadingSentinel">正在读取 photos.json ...</div>
    </main>
  </div>

  <!-- 大图弹窗 Modal -->
  <div class="lightbox-modal" id="lightbox">
    <span class="lightbox-close" id="lightboxClose" onclick="closeLightbox()">&times;</span>
    <div class="lightbox-body" id="lightboxMedia"></div>
    <div class="lightbox-footer">
      <h3 id="lightboxTitle"></h3>
      <p id="lightboxMeta" style="margin-top:6px; font-size:0.85rem; opacity:0.85;"></p>
      <p id="lightboxNotes" style="margin-top:6px; font-size:0.85rem; color:#e0e0e0;"></p>
    </div>
  </div>

  <script>
    // 控制单页载入数量，减少卡顿
    const PAGE_SIZE = 16;
    let rawPhotos = [];
    let filteredPhotos = [];
    let loadedCount = 0;
    let activeFilterType = 'all';
    let activeFilterValue = null;

    // 移动端 Sidebar 抽屉控制
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('active');
    }

    // 1. 初始化
    async function init() {
      try {
        const res = await fetch('./photos.json?v=' + Date.now());
        if (!res.ok) throw new Error('读取 photos.json 失败');
        const data = await res.json();

        rawPhotos = data.map(item => ({
          ...item,
          url: (item.url || '').trim(),
          thumbUrl: (item.thumbUrl || item.url || '').trim() // 降级机制：无缩略图时使用原图
        }));

        buildMonthMenu();
        applyFilter();
      } catch (err) {
        console.error('详细报错信息:', err);
        document.getElementById('loadingSentinel').innerText = '❌ 加载 photos.json 失败，请检查文件路径或网络连接。';
      }
    }

    // 2. 构建月份菜单
    function buildMonthMenu() {
      const months = new Set();
      rawPhotos.forEach(item => { if (item.monthKey) months.add(item.monthKey); });

      const container = document.getElementById('month-sub-menu');
      container.innerHTML = '';

      Array.from(months).sort().reverse().forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'sidebar-btn sub-item';
        btn.innerText = `📅 ${m}`;
        btn.onclick = () => selectFilter('monthKey', m, btn);
        container.appendChild(btn);
      });
    }

    // 3. 筛选菜单切换
    function selectFilter(type, value = null, btnElement = null) {
      activeFilterType = type;
      activeFilterValue = value;

      document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      if (btnElement) {
        btnElement.classList.add('active');
      } else {
        const defaultBtn = document.getElementById(`btn-${type}`);
        if (defaultBtn) defaultBtn.classList.add('active');
      }

      closeSidebar();
      applyFilter();
    }

    // 4. 数据过滤与排序
    function applyFilter() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

      let matches = rawPhotos.filter(item => {
        let matchFilter = true;

        switch (activeFilterType) {
          case 'all': 
            matchFilter = (item.type !== 'video'); 
            break;
          case 'albums': matchFilter = (item.albums && item.albums.length > 0); break;
          case 'people': matchFilter = (item.people && item.people.length > 0); break;
          case 'location': matchFilter = !!item.location; break;
          case 'videos': matchFilter = (item.type === 'video'); break;
          case 'documents': matchFilter = (item.type === 'document' || (item.albums && item.albums.includes('文档'))); break;
          case 'screenshots': matchFilter = (item.type === 'screenshot' || (item.albums && item.albums.includes('截图'))); break;
          case 'monthKey': matchFilter = (item.monthKey === activeFilterValue); break;
        }

        const searchStr = `${item.title || ''} ${item.location || ''} ${item.age || ''} ${item.notes || ''} ${(item.people || []).join(' ')}`.toLowerCase();
        const matchSearch = !keyword || searchStr.includes(keyword);

        return matchFilter && matchSearch;
      });

      // 默认按日期降序
      matches.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

      filteredPhotos = matches;
      document.getElementById('gallery').innerHTML = '';
      loadedCount = 0;
      loadMore();
    }

    // 5. 分页加载
    function loadMore() {
      const gallery = document.getElementById('gallery');
      const sentinel = document.getElementById('loadingSentinel');

      if (loadedCount >= filteredPhotos.length) {
        sentinel.innerText = filteredPhotos.length > 0 ? '已加载完毕' : '欢楽加载中...';
        return;
      }

      const nextBatch = filteredPhotos.slice(loadedCount, loadedCount + PAGE_SIZE);
      loadedCount += nextBatch.length;

      nextBatch.forEach(item => {
        const monthKey = item.monthKey || '未分类';
        let monthGroup = document.getElementById(`group-${monthKey}`);

        if (!monthGroup) {
          monthGroup = document.createElement('div');
          monthGroup.className = 'month-group';
          monthGroup.id = `group-${monthKey}`;
          monthGroup.innerHTML = `
            <div class="month-header">${monthKey}</div>
            <div class="photo-grid" id="grid-${monthKey}"></div>
          `;
          gallery.appendChild(monthGroup);
        }

        const grid = document.getElementById(`grid-${monthKey}`);
        grid.appendChild(createCard(item));
      });

      sentinel.innerText = loadedCount >= filteredPhotos.length ? '已加载完毕' : '向上滑动加载更多...';
    }

    // 6. 渲染卡片：完全使用轻量级 thumbUrl，去除 HTML 实时视频解码，极大提升流畅度
    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'photo-card';

      const rawUrl = (item.url || '').trim();
      // 优先取极轻量的 WebP 缩略图
      const displayThumb = item.thumbUrl; 
      const isVideo = item.type === 'video' || rawUrl.endsWith('.webm') || rawUrl.endsWith('.mp4');

      let mediaContent = '';

      if (isVideo) {
        // 视频：同样用 <img> 载入截好的静态首帧 WebP 缩略图，右上角贴标
        mediaContent = `
          <div class="media-wrapper">
            <div class="video-badge">▶ 视频</div>
            <img src="${displayThumb}" loading="lazy" alt="${item.title || ''}" referrerpolicy="no-referrer">
          </div>
        `;
      } else {
        mediaContent = `
          <div class="media-wrapper">
            <img src="${displayThumb}" loading="lazy" alt="${item.title || ''}" referrerpolicy="no-referrer">
          </div>
        `;
      }

      // 保持底部的元数据展示：标题、年龄、时间
      const titleText = item.title ? item.title : (isVideo ? '精彩视频' : '欢楽瞬间');
      const ageText = item.age ? ` (${item.age})` : '';
      const dateText = item.date ? item.date : '';

      card.innerHTML = `
        ${mediaContent}
        <div class="card-meta-bar">
          <div class="card-title-text" title="${titleText}">${titleText}</div>
          <div class="card-sub-text">
            <span>📅 ${dateText}${ageText}</span>
          </div>
        </div>
      `;

      // 点击卡片，Modal 加载高清原画/原视频 (item.url)
      card.onclick = () => openLightbox(item);
      return card;
    }

    // 7. 打开 Modal 查看大图/播放高清原视频
// 7. 打开 Modal 查看大图/播放高清原视频（修复 Safari/iOS 播放卡顿与暂停问题）
function openLightbox(item) {
  const mediaContainer = document.getElementById('lightboxMedia');
  const cleanUrl = (item.url || '').trim();
  const isVideo = item.type === 'video' || cleanUrl.endsWith('.webm') || cleanUrl.endsWith('.mp4');

  if (isVideo) {
    // 强制使用原生 video 结构，加 preload="auto" 和 crossOrigin
    mediaContainer.innerHTML = `
      <video id="activeVideo" class="lightbox-media" controls playsinline preload="auto" crossorigin="anonymous">
        <source src="${cleanUrl}" type="${cleanUrl.endsWith('.webm') ? 'video/webm' : 'video/mp4'}">
        您的浏览器不支持该视频格式。
      </video>
    `;

    // 显式用 JS 触发播放，并捕获自动播放被限制的异常
    const videoElem = document.getElementById('activeVideo');
    if (videoElem) {
      const playPromise = videoElem.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.warn("自动播放被浏览器拦截，降级为等待用户手动点击播放:", error);
          // 如果带声音自动播放被拦截，取消 autoplay，让用户手动点播放键
          videoElem.controls = true;
        });
      }
    }
  } else {
    // 加载高清原图
    mediaContainer.innerHTML = `<img class="lightbox-media" src="${cleanUrl}" referrerpolicy="no-referrer">`;
  }

  document.getElementById('lightboxTitle').innerText = item.title || '无标题';
  document.getElementById('lightboxMeta').innerText = `拍摄时间: ${item.date || '未知'} ${item.age ? '| 年龄: ' + item.age : ''} ${item.location ? '| 地点: ' + item.location : ''}`;
  document.getElementById('lightboxNotes').innerText = item.notes ? `📝 ${item.notes}` : '';

  document.getElementById('lightbox').classList.add('active');
}

    // 🛠️ 关键修复：关闭 Modal 时彻底销毁视频，防止后台继续发声/占用内存
    function closeLightbox() {
      const modal = document.getElementById('lightbox');
      const mediaContainer = document.getElementById('lightboxMedia');
      
      // 如果 Modal 里有正在播放的视频，强制暂停并摧毁连接
      const video = mediaContainer.querySelector('video');
      if (video) {
        video.pause();
        video.src = '';
        video.load(); // 强行让浏览器释放视频资源
      }
      
      mediaContainer.innerHTML = ''; // 清空容器
      modal.classList.remove('active');
    }

    // 支持 ESC 键关闭 Modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    // 8. 滚动监听
    const observer = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) loadMore();
    }, { root: document.getElementById('mainScrollArea'), rootMargin: '200px' });

    observer.observe(document.getElementById('loadingSentinel'));

    document.getElementById('searchInput').oninput = applyFilter;

    window.onload = init;
  </script>
</body>
</html>
